<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClass-Box</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1a19;
        color: #e8e6e3;
        font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      }
      .boot {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 36px;
        text-align: center;
      }
      .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #4cc2ff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .t {
        font-size: 14px;
        letter-spacing: 0.08em;
        opacity: 0.8;
        line-height: 1.9;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="boot">
      <div class="spinner" id="spin"></div>
      <div class="t" id="tip">OpenClass-Box 启动中…</div>
    </div>
    <script>
      // 本页加载完成即切换到真实应用（同目录 index.html）
      setTimeout(function () {
        try {
          location.replace("index.html");
        } catch (e) {
          /* 失败由下面的兜底提示接管 */
        }
      }, 400);

      // 兜底：若数秒后仍停留在本页（跳转失败 / 界面无法渲染），
      // 给出可执行的提示，而不是让人对着黑屏猜。
      setTimeout(function () {
        var tip = document.getElementById("tip");
        var spin = document.getElementById("spin");
        if (!tip) return;
        if (spin) {
          spin.style.animationPlayState = "paused";
          spin.style.borderTopColor = "#ffb020";
        }
        tip.textContent =
          "界面未能加载。请确认本机已安装 Microsoft Edge WebView2 运行时，然后按 F5 重试；" +
          "若问题依旧，请把此界面截图发到交流群 1124622970。";
        tip.style.opacity = "0.95";
      }, 7000);
    </script>
  </body>
</html>
