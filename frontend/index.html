<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClass</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-loader">
      <div class="boot-spinner"></div>
      <div class="boot-text">OpenClass 启动中…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        background: #1b1a19;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        z-index: 99999;
        transition: opacity 0.3s ease;
      }
      .boot-spinner {
        width: 46px;
        height: 46px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #4cc2ff;
        border-radius: 50%;
        animation: bootspin 0.9s linear infinite;
      }
      .boot-text {
        color: #e8e6e3;
        font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
        font-size: 14px;
        letter-spacing: 0.08em;
        opacity: 0.8;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script>
      window.__removeBootLoader = function () {
        var el = document.getElementById("boot-loader");
        if (el) {
          el.classList.add("hidden");
          setTimeout(function () {
            el.remove();
          }, 350);
        }
      };
    </script>
  </body>
</html>
